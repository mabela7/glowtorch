<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>GlowTorch</title>
</head>
<body>
  <div id="app">
    <header>
      <div class="mark">G</div>
      <div>
        <p class="eyebrow">UTILITY</p>
        <h1>GlowTorch</h1>
      </div>
      <span class="status" id="status"><i></i> OFF</span>
    </header>

    <main>
      <p class="hint" id="hint">Your light, one tap away.</p>
      <button id="torchButton" class="torch-button" aria-label="Turn flashlight on">
        <span class="halo"></span>
        <span class="bulb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 8h20l-2 13 7 10v8H17v-8l7-10-2-13Z"/><path d="M22 44h20M24 50h16M27 56h10"/></svg></span>
        <span class="button-label" id="buttonLabel">TAP TO TURN ON</span>
      </button>
      <p class="subhint" id="subhint">LED flashlight control</p>
    </main>

    <footer>
      <span>GLOWTORCH</span>
      <span>Simple. Bright. Ready.</span>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
